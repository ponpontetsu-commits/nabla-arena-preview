name: NABLA Answer Log V2 (verified)

on:
  push:
    branches:
      - nabla-math-steps-prototype
    paths:
      - apply_nabla_answer_log_v2.py
      - test_nabla_answer_log_v2.py
      - .github/workflows/nabla-answer-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nabla-answer-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-test:
    if: github.ref == 'refs/heads/nabla-math-steps-prototype'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Apply strict answer-log patch
        run: python apply_nabla_answer_log_v2.py
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Check JS syntax
        run: |
          node --check app.js
          node --check nabla_upgrade_ui.js
      - name: New answer-log regression tests
        run: python -m unittest -v test_nabla_answer_log_v2
      - name: Existing full regression suite
        run: python -m unittest discover -v -p 'test_*.py'
      - name: Commit tested application changes
        run: |
          if ! git diff --quiet -- nabla_steps.py server.py app.js nabla_upgrade_ui.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add nabla_steps.py server.py app.js nabla_upgrade_ui.js
            git commit -m 'Apply verified concise answer-log V2'
            git push origin HEAD:nabla-math-steps-prototype
          else
            echo 'No changed application files'
          fi
